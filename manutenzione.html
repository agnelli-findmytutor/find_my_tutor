<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manutenzione Programmata | Find My Tutor Agnelli</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#D32F2F">
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <style>
        :root {
            --agnelli-red: #D32F2F;
            --agnelli-dark: #B71C1C;
            --agnelli-deeper: #9A0007;
            --agnelli-soft: #FFEBEE;
            --agnelli-border: #FFCDD2;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            background-image:
                radial-gradient(at 0% 0%, rgba(211, 47, 47, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(183, 28, 28, 0.08) 0px, transparent 50%);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .maintenance-card {
            background: #ffffff;
            padding: 46px 38px;
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(211, 47, 47, 0.14);
            border-top: 6px solid var(--agnelli-red);
            position: relative;
            overflow: hidden;
        }

        .maint-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--agnelli-soft);
            color: var(--agnelli-red);
            border: 1px solid var(--agnelli-border);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 22px;
        }

        .maint-dot {
            width: 8px;
            height: 8px;
            background: var(--agnelli-red);
            border-radius: 50%;
            animation: pulseDot 1.8s infinite;
        }

        .icon-box {
            width: 82px;
            height: 82px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--agnelli-red) 0%, var(--agnelli-deeper) 100%);
            color: #ffffff;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            box-shadow: 0 12px 28px rgba(211, 47, 47, 0.28);
            animation: floatIcon 3s ease-in-out infinite;
        }

        h1 {
            font-size: 1.95rem;
            font-weight: 800;
            margin: 0 0 12px;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        h1 span {
            color: var(--agnelli-red);
        }

        p {
            color: var(--text-muted);
            font-size: 0.96rem;
            line-height: 1.65;
            margin: 0 0 28px;
        }

        .maint-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .staff-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--agnelli-dark);
            background: #fff5f5;
            font-size: 0.86rem;
            font-weight: 700;
            text-decoration: none;
            border: 1.5px solid var(--agnelli-border);
            padding: 11px 22px;
            border-radius: 50px;
            transition: all 0.25s ease;
        }

        .staff-link:hover {
            color: #ffffff;
            border-color: var(--agnelli-red);
            background: var(--agnelli-red);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(211, 47, 47, 0.25);
        }

        .maint-footer {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid #f1f5f9;
            font-size: 0.78rem;
            color: #94a3b8;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.65; }
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>

<body>

    <div class="maintenance-card">
        <div class="maint-badge">
            <span class="maint-dot"></span>
            <span>Aggiornamento Piattaforma</span>
        </div>
        <div class="icon-box">
            <i class="fas fa-tools"></i>
        </div>
        <h1>Sito in <span>Manutenzione</span></h1>
        <p>Stiamo aggiornando <strong>FindMyTutor</strong> per migliorare le prestazioni e sincronizzare i servizi dell'Istituto Agnelli.<br>Torneremo online tra pochissimo.</p>

        <div class="maint-actions">
            <a href="login.html" class="staff-link"><i class="fas fa-user-shield"></i> Accesso Amministratori</a>
        </div>

        <div class="maint-footer">
            <i class="fas fa-graduation-cap" style="color:var(--agnelli-red);"></i> Istituto Internazionale Edoardo Agnelli &bull; Torino
        </div>
    </div>

</body>

</html>
